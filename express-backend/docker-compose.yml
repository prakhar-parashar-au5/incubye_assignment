# Local MySQL 8 with two databases:
#   acme_dev   local frontend/backend preview (migrate and seed explicitly)
#   acme_test  destructive integration tests (tests reset its tables)
# The credentials below are fixed, local-only values, not secrets.
# The port is bound to 127.0.0.1, and data lives in tmpfs (lost on restart;
# the init script runs again on every fresh start).
# Use the project commands (npm run db:up / db:down), which disable .env loading.
name: acme-take-home

services:
  mysql:
    image: mysql:8.4
    container_name: acme-take-home-mysql
    command:
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: acme_local_root
      MYSQL_DATABASE: acme_test
      MYSQL_USER: acme
      MYSQL_PASSWORD: acme_local
    volumes:
      # Creates acme_dev and grants acme access (db/docker-init/01-create-acme-dev.sql).
      - ./db/docker-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:3317:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uacme", "-pacme_local"]
      interval: 2s
      timeout: 5s
      retries: 30
